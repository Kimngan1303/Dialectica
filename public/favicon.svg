<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="phi-bg" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="60%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#3b070d" />
    </radialGradient>

    <!-- Polished Gold Gradient -->
    <linearGradient id="phi-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="90%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flame-grad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="32" cy="32" r="30" fill="url(#phi-bg)" stroke="url(#phi-gold)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="rgba(251, 191, 36, 0.45)" stroke-width="1" stroke-dasharray="2 1.5" />

  <!-- Radiance Rays -->
  <g stroke="rgba(254, 240, 138, 0.25)" stroke-width="1" stroke-linecap="round">
    <line x1="32" y1="8" x2="32" y2="4" />
    <line x1="22" y1="11" x2="19" y2="8" />
    <line x1="42" y1="11" x2="45" y2="8" />
    <line x1="14" y1="19" x2="10" y2="17" />
    <line x1="50" y1="19" x2="54" y2="17" />
  </g>

  <!-- Laurel Wreath (Wisdom & Philosophy) -->
  <g fill="#d97706" opacity="0.85">
    <!-- Left Leaves -->
    <path d="M 12 36 C 10 33 11 28 14 26 C 14 29 13 33 12 36 Z" />
    <path d="M 14 28 C 13 24 15 20 19 19 C 18 22 16 26 14 28 Z" />
    <path d="M 18 21 C 18 17 21 14 25 14 C 23 17 21 20 18 21 Z" />
    <!-- Right Leaves -->
    <path d="M 52 36 C 54 33 53 28 50 26 C 50 29 51 33 52 36 Z" />
    <path d="M 50 28 C 51 24 49 20 45 19 C 46 22 48 26 50 28 Z" />
    <path d="M 46 21 C 46 17 43 14 39 14 C 41 17 43 20 46 21 Z" />
  </g>

  <!-- Open Philosophical Tome / Cuốn Sách Triết Học Biện Chứng -->
  <!-- Left Page -->
  <path d="M 32 49 Q 22 47 13 44.5 L 13 36.5 Q 22 39 32 41.5 Z" fill="#fef9c3" stroke="#b45309" stroke-width="1.2" stroke-linejoin="round" />
  <path d="M 16 39.5 Q 23 41.5 30 43.5" stroke="#ca8a04" stroke-width="0.8" fill="none" opacity="0.7" />
  <path d="M 16 42 Q 23 44 30 46" stroke="#ca8a04" stroke-width="0.8" fill="none" opacity="0.7" />

  <!-- Right Page -->
  <path d="M 32 49 Q 42 47 51 44.5 L 51 36.5 Q 42 39 32 41.5 Z" fill="#fef9c3" stroke="#b45309" stroke-width="1.2" stroke-linejoin="round" />
  <path d="M 48 39.5 Q 41 41.5 34 43.5" stroke="#ca8a04" stroke-width="0.8" fill="none" opacity="0.7" />
  <path d="M 48 42 Q 41 44 34 46" stroke="#ca8a04" stroke-width="0.8" fill="none" opacity="0.7" />

  <!-- Book Spine / Center Rib -->
  <path d="M 32 41.5 L 32 50.5" stroke="#92400e" stroke-width="2" stroke-linecap="round" />

  <!-- Universal Philosophy Symbol Φ (Phi) -->
  <!-- Oval of Φ -->
  <ellipse cx="32" cy="27" rx="12" ry="9" fill="none" stroke="url(#phi-gold)" stroke-width="3.8" filter="url(#soft-glow)" />
  <ellipse cx="32" cy="27" rx="12" ry="9" fill="none" stroke="#78350f" stroke-width="0.8" />

  <!-- Central Column / Torch Stem of Φ -->
  <rect x="29.8" y="12" width="4.4" height="30" rx="1.5" fill="url(#phi-gold)" stroke="#78350f" stroke-width="0.7" filter="url(#soft-glow)" />

  <!-- Torch Base Pedestal -->
  <path d="M 28 42 L 36 42 L 34.5 44 L 29.5 44 Z" fill="url(#phi-gold)" />

  <!-- Radiant Torch Flame of Truth / Ngọn Đuốc Chân Lý -->
  <path d="M 32 4.5 C 35 8 37 10.5 35 13.5 C 33.5 15.5 30.5 15.5 29 13.5 C 27 10.5 29 8 32 4.5 Z" 
        fill="url(#flame-grad)" filter="url(#soft-glow)" />
  <path d="M 32 8 C 33.5 10 34.5 11.5 33.5 13 C 32.8 14 31.2 14 30.5 13 C 29.5 11.5 30.5 10 32 8 Z" 
        fill="#ffffff" />

  <!-- Tiny Golden Star of Truth at the Summit -->
  <polygon points="32,2 33,4.2 35.2,4.5 33.5,6 34,8.2 32,7.2 30,8.2 30.5,6 28.8,4.5 31,4.2" fill="#fef08a" />
</svg>