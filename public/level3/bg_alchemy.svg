<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="lab_wood_desk" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#2a0c12" />
      <stop offset="60%" stop-color="#180407" />
      <stop offset="100%" stop-color="#0a0204" />
    </linearGradient>
    <linearGradient id="brass_metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="glass_liquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)" />
      <stop offset="25%" stop-color="rgba(251,191,36,0.3)" />
      <stop offset="75%" stop-color="rgba(239,68,68,0.35)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.7)" />
    </linearGradient>
    <filter id="flask_glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark Academic Laboratory Background -->
  <rect width="800" height="420" fill="#140407" />
  <!-- Neoclassical Wainscoting & Brass Trims -->
  <rect x="0" y="50" width="800" height="8" fill="url(#brass_metal)" opacity="0.6" />
  <rect x="0" y="415" width="800" height="12" fill="url(#brass_metal)" opacity="0.75" />

  <!-- Heavy Polished Mahogany Lab Workbench Surface (y: 420 to 600) -->
  <rect y="420" width="800" height="180" fill="url(#lab_wood_desk)" />
  <!-- Beveled Front Table Edge -->
  <line x1="0" y1="422" x2="800" y2="422" stroke="#fef08a" stroke-width="2" opacity="0.7" />
  <line x1="0" y1="440" x2="800" y2="440" stroke="#78350f" stroke-width="2" />

  <!-- Brass Laboratory Rigging & Retort Stands (Center: x: 300 to 580) -->
  <!-- Base Plate on Table -->
  <rect x="320" y="440" width="240" height="24" rx="4" fill="#1b080b" stroke="url(#brass_metal)" stroke-width="3" />
  <!-- Vertical Stanchion Rods -->
  <rect x="340" y="160" width="10" height="280" fill="url(#brass_metal)" />
  <rect x="540" y="120" width="10" height="320" fill="url(#brass_metal)" />

  <!-- Horizontal Clamps -->
  <rect x="330" y="240" width="80" height="8" fill="url(#brass_metal)" />
  <rect x="470" y="155" width="80" height="8" fill="url(#brass_metal)" />

  <!-- Burner Stand beneath Main Center Flask (left: 360, top: 380 area) -->
  <!-- Burner Platform Ring -->
  <ellipse cx="400" cy="385" rx="45" ry="12" fill="#140306" stroke="url(#brass_metal)" stroke-width="3" />
  <!-- Tripod Legs -->
  <line x1="365" y1="385" x2="350" y2="440" stroke="url(#brass_metal)" stroke-width="4" />
  <line x1="435" y1="385" x2="450" y2="440" stroke="url(#brass_metal)" stroke-width="4" />
  <!-- Burner Base Cup -->
  <rect x="375" y="395" width="50" height="35" rx="6" fill="#1b070b" stroke="#f59e0b" stroke-width="2" />
  <circle cx="400" cy="412" r="8" fill="#fbbf24" stroke="#78350f" stroke-width="1.5" />

  <!-- Central Reaction Alembic Flask (x: 340 to 460, y: 220 to 370) -->
  <!-- Flask Body -->
  <circle cx="400" cy="300" r="65" fill="url(#glass_liquid)" stroke="#f59e0b" stroke-width="3" filter="url(#flask_glow)" />
  <!-- Flask Neck -->
  <rect x="385" y="190" width="30" height="50" fill="url(#glass_liquid)" stroke="#f59e0b" stroke-width="2.5" />
  <ellipse cx="400" cy="190" rx="16" ry="6" fill="#1c070c" stroke="#f59e0b" stroke-width="2" />
  
  <!-- Right Addition Funnel (alchemy_add_liquid hotspot: left: 490, top: 120, width: 80, height: 80) -->
  <polygon points="500,120 560,120 535,160 525,160" fill="url(#glass_liquid)" stroke="#38bdf8" stroke-width="2" filter="url(#flask_glow)" />
  <ellipse cx="530" cy="120" rx="30" ry="8" fill="rgba(56,189,248,0.4)" stroke="#38bdf8" stroke-width="2" />
  <!-- Delivery Tube to Main Flask -->
  <path d="M 530 160 L 530 190 Q 530 220, 410 220" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <text x="530" y="105" font-family="serif" font-size="10" fill="#38bdf8" font-weight="bold" text-anchor="middle">PHỄU NẠP MẪU</text>

  <!-- Left Condenser Coil & Receiving Flask (alchemy_brew hotspot: left: 240, top: 200, width: 120, height: 180) -->
  <!-- Spiral Condenser Tube -->
  <path d="M 390 200 Q 340 180, 300 230 T 290 320" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.8" />
  <!-- Cooling Water Jacket around Coil -->
  <rect x="270" y="215" width="40" height="90" rx="8" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="2" />
  <!-- Left Receiving Conical Flask -->
  <polygon points="280,310 300,310 330,380 250,380" fill="url(#glass_liquid)" stroke="url(#brass_metal)" stroke-width="2.5" filter="url(#flask_glow)" />
  <ellipse cx="290" cy="380" rx="40" ry="10" fill="#1b070c" stroke="url(#brass_metal)" stroke-width="2" />
  <text x="290" y="405" font-family="serif" font-size="10" fill="#fde68a" font-weight="bold" text-anchor="middle">BÌNH THU HỒI CHÂN LÝ</text>

  <!-- Scientific Calibration Dial on Right Wall -->
  <circle cx="700" cy="200" r="45" fill="#180407" stroke="url(#brass_metal)" stroke-width="3" />
  <circle cx="700" cy="200" r="38" fill="#100305" stroke="#d97706" stroke-width="1.5" />
  <line x1="700" y1="200" x2="715" y2="175" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
  <circle cx="700" cy="200" r="5" fill="#fbbf24" />
  <text x="700" y="260" font-family="serif" font-size="9" fill="#fbbf24" font-weight="bold" text-anchor="middle">ĐỒNG HỒ ÁP SUẤT</text>
</svg>
