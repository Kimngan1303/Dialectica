<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="vault_stone" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#0a121c" />
      <stop offset="50%" stop-color="#050a10" />
      <stop offset="100%" stop-color="#020406" />
    </linearGradient>
    <linearGradient id="brass_conduit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <radialGradient id="cyan_core_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <filter id="c_glow">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Subterranean Vault Wall -->
  <rect width="800" height="600" fill="url(#vault_stone)" />

  <!-- Vaulted Stone Arches -->
  <!-- Main Arch Left -->
  <path d="M 0 500 C 0 150, 300 100, 400 100" fill="none" stroke="#1e293b" stroke-width="35" />
  <path d="M 0 500 C 0 150, 300 100, 400 100" fill="none" stroke="url(#brass_conduit)" stroke-width="4" />
  <!-- Main Arch Right -->
  <path d="M 800 500 C 800 150, 500 100, 400 100" fill="none" stroke="#1e293b" stroke-width="35" />
  <path d="M 800 500 C 800 150, 500 100, 400 100" fill="none" stroke="url(#brass_conduit)" stroke-width="4" />

  <!-- Arch Keystone in Center -->
  <polygon points="380,80 420,80 410,120 390,120" fill="url(#brass_conduit)" stroke="#fbbf24" stroke-width="1.5" />

  <!-- Subterranean Stone Bricks Pattern -->
  <line x1="80" y1="200" x2="220" y2="200" stroke="#1e293b" stroke-width="1.5" opacity="0.6" />
  <line x1="140" y1="200" x2="140" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.6" />
  <line x1="80" y1="240" x2="250" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.6" />
  <line x1="580" y1="200" x2="720" y2="200" stroke="#1e293b" stroke-width="1.5" opacity="0.6" />
  <line x1="640" y1="200" x2="640" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.6" />
  <line x1="560" y1="240" x2="720" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.6" />

  <!-- Glowing Energy Conduits Pulsing with Material Reality -->
  <path d="M 0 350 L 260 350 L 340 370" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.75" filter="url(#c_glow)" />
  <path d="M 800 350 L 540 350 L 460 370" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.75" filter="url(#c_glow)" />

  <!-- Center Dais / Pedestal for Objective Reality Crystal (x: 270 to 530, y: 350 to 520) -->
  <!-- Ambient Core Aura behind crystal -->
  <circle cx="400" cy="350" r="160" fill="url(#cyan_core_glow)" />

  <!-- Octagonal Stepped Pedestal Base -->
  <polygon points="260,490 540,490 570,540 230,540" fill="#0c1724" stroke="url(#brass_conduit)" stroke-width="3" />
  <polygon points="290,440 510,440 540,490 260,490" fill="#132337" stroke="#38bdf8" stroke-width="2" />
  <polygon points="320,400 480,400 510,440 290,440" fill="#1e3a5f" stroke="url(#brass_conduit)" stroke-width="2.5" />
  
  <!-- Glowing containment ring on top of dais -->
  <ellipse cx="400" cy="400" rx="80" ry="24" fill="#0284c7" stroke="#bae6fd" stroke-width="3" filter="url(#c_glow)" opacity="0.8" />
  <ellipse cx="400" cy="400" rx="60" ry="18" fill="#38bdf8" filter="url(#c_glow)" opacity="0.9" />

  <!-- Pedestal Inscription Plaque -->
  <rect x="310" y="455" width="180" height="24" rx="4" fill="#07111a" stroke="url(#brass_conduit)" stroke-width="1.5" />
  <text x="400" y="471" font-family="serif" font-size="10" fill="#38bdf8" font-weight="bold" text-anchor="middle" letter-spacing="1">THỰC TẠI KHÁCH QUAN</text>

  <!-- Stone Shelf on the right for Vacuum Flask (x: 580 to 720, y: 380 to 460) -->
  <polygon points="580,390 710,390 730,420 570,420" fill="#142131" stroke="url(#brass_conduit)" stroke-width="2" />
  <rect x="585" y="420" width="15" height="70" fill="url(#brass_conduit)" />
  <rect x="685" y="420" width="15" height="70" fill="url(#brass_conduit)" />
  <text x="645" y="410" font-family="serif" font-size="8" fill="#fde68a" text-anchor="middle">GIÁ ĐỰNG BÌNH HÚT</text>

  <!-- Ladder up to Wall 4 in center top (ladder_down / ▲ hotspot) -->
  <rect x="360" y="0" width="80" height="60" fill="#000" stroke="url(#brass_conduit)" stroke-width="2" />
  <!-- Ladder rungs -->
  <line x1="380" y1="0" x2="380" y2="70" stroke="url(#brass_conduit)" stroke-width="4" />
  <line x1="420" y1="0" x2="420" y2="70" stroke="url(#brass_conduit)" stroke-width="4" />
  <line x1="380" y1="15" x2="420" y2="15" stroke="#fbbf24" stroke-width="3" />
  <line x1="380" y1="35" x2="420" y2="35" stroke="#fbbf24" stroke-width="3" />
  <line x1="380" y1="55" x2="420" y2="55" stroke="#fbbf24" stroke-width="3" />

  <!-- Floor flagstones -->
  <line x1="0" y1="600" x2="230" y2="540" stroke="#1e293b" stroke-width="2" />
  <line x1="800" y1="600" x2="570" y2="540" stroke="#1e293b" stroke-width="2" />
  <line x1="360" y1="600" x2="360" y2="540" stroke="#1e293b" stroke-width="2" />
  <line x1="440" y1="600" x2="440" y2="540" stroke="#1e293b" stroke-width="2" />
</svg>
