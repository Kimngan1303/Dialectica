<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="wall2_wood" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#24070a" />
      <stop offset="60%" stop-color="#180407" />
      <stop offset="100%" stop-color="#0d0204" />
    </linearGradient>
    <linearGradient id="brass_g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <radialGradient id="sunbeam" cx="15%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <filter id="opt_glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Wall Background -->
  <rect width="800" height="460" fill="url(#wall2_wood)" />
  
  <!-- Architectural Moldings -->
  <rect x="0" y="45" width="800" height="10" fill="url(#brass_g)" opacity="0.6" />
  <rect x="0" y="445" width="800" height="15" fill="url(#brass_g)" opacity="0.7" />

  <!-- Arched Window on upper left letting light into optical lab -->
  <path d="M 60 140 A 50 50 0 0 1 160 140 L 160 220 L 60 220 Z" fill="#2d130a" stroke="url(#brass_g)" stroke-width="3" />
  <path d="M 85 140 L 85 220 M 110 95 L 110 220 M 135 140 L 135 220" stroke="#f59e0b" stroke-width="1.5" />
  <line x1="60" y1="160" x2="160" y2="160" stroke="#f59e0b" stroke-width="1.5" />
  <!-- Volumetric light stream from window across left table -->
  <polygon points="60,140 160,140 380,460 0,460" fill="url(#sunbeam)" />

  <!-- Left Optics Station Bench (x: 10 to 360, y: 320 to 460) -->
  <polygon points="10,360 360,360 380,460 0,460" fill="#1f090d" stroke="url(#brass_g)" stroke-width="2" />
  <!-- Optical Rail on Table -->
  <rect x="30" y="354" width="310" height="8" rx="2" fill="url(#brass_g)" />
  <line x1="40" y1="358" x2="330" y2="358" stroke="#1f090d" stroke-width="2" />
  <!-- Grid calibration markers on left wall -->
  <rect x="30" y="240" width="120" height="70" fill="#140407" stroke="#b45309" stroke-width="1.5" rx="3" />
  <line x1="30" y1="260" x2="150" y2="260" stroke="#78350f" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="30" y1="280" x2="150" y2="280" stroke="#78350f" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="70" y1="240" x2="70" y2="310" stroke="#78350f" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="110" y1="240" x2="110" y2="310" stroke="#78350f" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="90" y="255" font-family="serif" font-size="8" fill="#fbbf24" text-anchor="middle">LƯỚI QUANG PHỔ</text>

  <!-- Central Gilded Vitrine / Frame (x: 290 to 510, y: 80 to 360) (crow_woman location) -->
  <rect x="290" y="80" width="220" height="270" rx="10" fill="#180508" stroke="url(#brass_g)" stroke-width="4" filter="url(#opt_glow)" />
  <rect x="302" y="92" width="196" height="246" fill="#110305" stroke="#fbbf24" stroke-width="1.5" />
  <!-- Arch inside vitrine -->
  <path d="M 320 180 A 80 80 0 0 1 480 180 L 480 320 L 320 320 Z" fill="#20060a" stroke="#d97706" stroke-width="1.5" />
  <!-- Vitrine Plaque -->
  <rect x="330" y="100" width="140" height="24" rx="4" fill="#2a080d" stroke="#d97706" stroke-width="1.5" />
  <text x="400" y="116" font-family="serif" font-size="10" fill="#fbbf24" font-weight="bold" text-anchor="middle">BUỒNG CẢM QUAN</text>
  <text x="400" y="315" font-family="serif" font-size="9" fill="#fde68a" font-style="italic" text-anchor="middle">Trực quan sinh động</text>

  <!-- Right Reading & Research Table (x: 480 to 760, y: 340 to 460) -->
  <polygon points="480,360 760,360 790,460 450,460" fill="#1c070b" stroke="url(#brass_g)" stroke-width="2" />
  <!-- Brass Table Legs -->
  <line x1="490" y1="360" x2="490" y2="460" stroke="#b45309" stroke-width="5" />
  <line x1="740" y1="360" x2="740" y2="460" stroke="#b45309" stroke-width="5" />
  <!-- Globe / Astrolabe on Right Table -->
  <circle cx="700" cy="330" r="24" fill="#2a080d" stroke="url(#brass_g)" stroke-width="2" />
  <ellipse cx="700" cy="330" rx="24" ry="10" fill="none" stroke="#fbbf24" stroke-width="1.5" />
  <line x1="700" y1="300" x2="700" y2="360" stroke="url(#brass_g)" stroke-width="3" />
  <polygon points="690,360 710,360 705,355 695,355" fill="url(#brass_g)" />

  <!-- Floor -->
  <rect x="0" y="460" width="800" height="140" fill="url(#wall2_wood)" />
  <line x1="0" y1="600" x2="180" y2="460" stroke="#3b1119" stroke-width="1.5" />
  <line x1="220" y1="600" x2="330" y2="460" stroke="#3b1119" stroke-width="1.5" />
  <line x1="580" y1="600" x2="520" y2="460" stroke="#3b1119" stroke-width="1.5" />
  <line x1="800" y1="600" x2="680" y2="460" stroke="#3b1119" stroke-width="1.5" />
</svg>
