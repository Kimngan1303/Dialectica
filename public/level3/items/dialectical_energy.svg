<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="spiralAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="80%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <filter id="dg">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="70" fill="url(#spiralAura)" opacity="0.3" />
  <!-- Swirling Yin-Yang Spiral Wings -->
  <path d="M 100 30 A 70 70 0 0 1 100 170 A 35 35 0 0 1 100 100 A 35 35 0 0 0 100 30 Z" fill="#ef4444" stroke="#fbbf24" stroke-width="2" filter="url(#dg)" />
  <path d="M 100 170 A 70 70 0 0 1 100 30 A 35 35 0 0 1 100 100 A 35 35 0 0 0 100 170 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="2" filter="url(#dg)" />
  <!-- Dots of opposite unity -->
  <circle cx="100" cy="65" r="9" fill="#fbbf24" />
  <circle cx="100" cy="135" r="9" fill="#ef4444" />
</svg>
