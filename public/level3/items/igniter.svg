<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="flame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="65%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowF">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Flame -->
  <circle cx="100" cy="55" r="45" fill="url(#flame)" filter="url(#glowF)" />
  <path d="M 100 20 Q 120 50, 100 75 Q 80 50, 100 20 Z" fill="#fff" filter="url(#glowF)" />
  <!-- Burner Head -->
  <polygon points="80,85 120,85 112,105 88,105" fill="#f59e0b" stroke="#78350f" stroke-width="2" />
  <!-- Collar -->
  <rect x="85" y="105" width="30" height="15" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="2" />
  <!-- Main Cylinder -->
  <rect x="70" y="120" width="60" height="65" rx="8" fill="url(#bodyGrad)" stroke="#f59e0b" stroke-width="3" />
  <!-- Gold dial -->
  <circle cx="100" cy="150" r="14" fill="#fbbf24" stroke="#78350f" stroke-width="2" />
  <line x1="100" y1="150" x2="108" y2="142" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
</svg>
