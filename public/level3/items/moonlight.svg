<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="moonAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="mng">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="70" fill="url(#moonAura)" opacity="0.3" filter="url(#mng)" />
  <!-- Golden Moon Crescent -->
  <path d="M 120 30 A 70 70 0 1 0 120 170 A 55 55 0 0 1 120 30 Z" fill="#fde047" stroke="#fbbf24" stroke-width="2" filter="url(#mng)" />
  <!-- Guiding Principle Star -->
  <polygon points="140,55 143,65 153,65 145,71 148,81 140,75 132,81 135,71 127,65 137,65" fill="#ffffff" filter="url(#mng)" />
</svg>
