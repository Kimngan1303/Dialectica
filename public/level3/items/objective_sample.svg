<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="matterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <filter id="mg">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="70" fill="url(#matterGlow)" opacity="0.35" />
  <!-- Isometric Cube representing Objective Matter -->
  <!-- Top Face -->
  <polygon points="100,45 155,75 100,105 45,75" fill="#38bdf8" stroke="#bae6fd" stroke-width="2" filter="url(#mg)" opacity="0.9" />
  <!-- Left Face -->
  <polygon points="45,75 100,105 100,165 45,135" fill="#0284c7" stroke="#38bdf8" stroke-width="2" opacity="0.9" />
  <!-- Right Face -->
  <polygon points="100,105 155,75 155,135 100,165" fill="#0369a1" stroke="#38bdf8" stroke-width="2" opacity="0.9" />
  <!-- Core glowing atom inside -->
  <circle cx="100" cy="105" r="14" fill="#fef08a" filter="url(#mg)" />
  <circle cx="100" cy="105" r="6" fill="#fff" />
</svg>
