<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="60%" stop-color="#881337" />
      <stop offset="100%" stop-color="#2a080c" />
    </linearGradient>
    <filter id="bglow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Book Spine / Pages -->
  <rect x="35" y="42" width="130" height="126" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
  <line x1="38" y1="162" x2="162" y2="162" stroke="#d97706" stroke-width="1.5" />
  <line x1="38" y1="165" x2="162" y2="165" stroke="#d97706" stroke-width="1.5" />
  <!-- Book Cover Front -->
  <rect x="30" y="35" width="135" height="125" rx="5" fill="url(#bookCover)" stroke="#fbbf24" stroke-width="2.5" />
  <!-- Gold Embossed Border -->
  <rect x="42" y="45" width="112" height="105" rx="3" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8 4" />
  <!-- Center Golden Star / Symbol -->
  <circle cx="98" cy="97" r="22" fill="#180509" stroke="#fbbf24" stroke-width="2" />
  <polygon points="98,80 102,92 115,92 104,100 108,112 98,104 88,112 92,100 81,92 94,92" fill="#fde047" filter="url(#bglow)" />
  <text x="98" y="132" font-family="serif" font-size="9" fill="#fde68a" font-weight="bold" text-anchor="middle" letter-spacing="1">GIÁO TRÌNH</text>
  <text x="98" y="142" font-family="serif" font-size="8" fill="#fde68a" text-anchor="middle">CHÂN LÝ</text>
</svg>
