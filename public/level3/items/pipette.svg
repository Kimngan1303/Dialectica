<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)" />
      <stop offset="30%" stop-color="rgba(56,189,248,0.3)" />
      <stop offset="70%" stop-color="rgba(14,165,233,0.5)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.8)" />
    </linearGradient>
    <filter id="glowP">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Top Suction Bulb -->
  <ellipse cx="100" cy="40" rx="28" ry="24" fill="#ef4444" stroke="#7f1d1d" stroke-width="2" />
  <rect x="92" y="60" width="16" height="12" fill="#b91c1c" />
  <!-- Glass Cylinder -->
  <rect x="88" y="72" width="24" height="85" rx="3" fill="url(#glass)" stroke="#38bdf8" stroke-width="2" />
  <!-- Liquid Inside -->
  <rect x="90" y="100" width="20" height="55" fill="rgba(56, 189, 248, 0.7)" filter="url(#glowP)" />
  <!-- Graduation lines -->
  <line x1="90" y1="85" x2="98" y2="85" stroke="#fff" stroke-width="1.5" />
  <line x1="90" y1="95" x2="102" y2="95" stroke="#fff" stroke-width="1.5" />
  <line x1="90" y1="105" x2="98" y2="105" stroke="#fff" stroke-width="1.5" />
  <line x1="90" y1="115" x2="102" y2="115" stroke="#fff" stroke-width="1.5" />
  <line x1="90" y1="125" x2="98" y2="125" stroke="#fff" stroke-width="1.5" />
  <!-- Nozzle Tip -->
  <polygon points="90,157 110,157 102,185 98,185" fill="url(#glass)" stroke="#38bdf8" stroke-width="2" />
  <!-- Droplet falling -->
  <ellipse cx="100" cy="192" rx="3" ry="5" fill="#38bdf8" filter="url(#glowP)" />
</svg>
