<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldShaft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Handle -->
  <rect x="35" y="145" width="22" height="40" rx="4" fill="#1c1917" stroke="#fbbf24" stroke-width="2" transform="rotate(-45, 46, 165)" />
  <circle cx="35" cy="175" r="7" fill="#fbbf24" stroke="#78350f" stroke-width="2" />
  <!-- Scientific Shaft -->
  <line x1="50" y1="150" x2="150" y2="50" stroke="url(#goldShaft)" stroke-width="8" stroke-linecap="round" />
  <!-- Calibrated Ticks -->
  <line x1="80" y1="116" x2="88" y2="124" stroke="#fbbf24" stroke-width="2" />
  <line x1="100" y1="96" x2="108" y2="104" stroke="#fbbf24" stroke-width="2" />
  <line x1="120" y1="76" x2="128" y2="84" stroke="#fbbf24" stroke-width="2" />
  <!-- Sensor Tip -->
  <polygon points="150,50 170,30 162,22 142,42" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="170" cy="30" r="5" fill="#f8fafc" filter="url(#glow)" />
</svg>
