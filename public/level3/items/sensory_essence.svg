<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="sensoryGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    <filter id="sg">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background aura -->
  <circle cx="100" cy="100" r="80" fill="url(#sensoryGlow)" opacity="0.3" filter="url(#sg)" />
  <!-- Radiant Sensory Teardrop / Essence Gem -->
  <path d="M 100 25 C 135 75, 160 115, 160 145 A 60 60 0 1 1 40 145 C 40 115, 65 75, 100 25 Z" fill="url(#sensoryGlow)" stroke="#fde047" stroke-width="3" filter="url(#sg)" />
  <!-- Optical Eye / Perception Lens in center -->
  <ellipse cx="100" cy="140" rx="26" ry="16" fill="#1e1b4b" stroke="#fef08a" stroke-width="2" />
  <circle cx="100" cy="140" r="10" fill="#38bdf8" />
  <circle cx="97" cy="137" r="3" fill="#ffffff" />
</svg>
