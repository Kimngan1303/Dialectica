<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="serumGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0" />
    </radialGradient>
    <filter id="sgf">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="115" r="65" fill="url(#serumGlow)" opacity="0.4" />
  <!-- Vial Bottle -->
  <rect x="85" y="30" width="30" height="12" rx="3" fill="#fbbf24" stroke="#78350f" stroke-width="2" />
  <rect x="88" y="42" width="24" height="20" fill="rgba(255,255,255,0.6)" stroke="#fbbf24" stroke-width="2" />
  <!-- Round Bottom Flask Body -->
  <circle cx="100" cy="118" r="50" fill="url(#serumGlow)" stroke="#fde047" stroke-width="3" filter="url(#sgf)" />
  <!-- Infinity Emblem on Flask -->
  <path d="M 80 118 C 80 108, 92 108, 100 118 C 108 128, 120 128, 120 118 C 120 108, 108 108, 100 118 C 92 128, 80 128, 80 118 Z" fill="none" stroke="#fff" stroke-width="3.5" filter="url(#sgf)" />
</svg>
