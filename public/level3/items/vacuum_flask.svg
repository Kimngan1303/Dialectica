<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="vacuumGlow" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)" />
      <stop offset="30%" stop-color="rgba(251,191,36,0.15)" />
      <stop offset="80%" stop-color="rgba(251,191,36,0.25)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.8)" />
    </linearGradient>
    <filter id="glowFk">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Glow inside -->
  <circle cx="100" cy="130" r="50" fill="url(#vacuumGlow)" />
  <!-- Flask Lip & Stopper -->
  <rect x="80" y="30" width="40" height="12" rx="3" fill="#fbbf24" stroke="#78350f" stroke-width="2" />
  <rect x="86" y="20" width="28" height="12" rx="3" fill="#b45309" />
  <!-- Neck -->
  <rect x="86" y="42" width="28" height="40" fill="url(#glassWall)" stroke="#f59e0b" stroke-width="2" />
  <!-- Conical Body -->
  <polygon points="86,82 114,82 165,165 35,165" fill="url(#glassWall)" stroke="#f59e0b" stroke-width="2.5" />
  <ellipse cx="100" cy="165" rx="65" ry="12" fill="#1c1917" stroke="#f59e0b" stroke-width="2.5" />
  <!-- Dialectical Seal / Markings -->
  <circle cx="100" cy="125" r="16" fill="none" stroke="#fef08a" stroke-dasharray="3 3" stroke-width="2" filter="url(#glowFk)" />
  <text x="100" y="129" font-family="serif" font-size="12" fill="#fef08a" text-anchor="middle" font-weight="bold">∞</text>
</svg>
